name: Crash report
description: The game crashes or won't start with NewSpawn
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in English or Portuguese.
        The crash file is in your game folder, inside `crash-reports`.
  - type: input
    id: version
    attributes:
      label: NewSpawn version
      description: The file name you downloaded, e.g. NewSpawn v1.2.06.jar
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - While the game is starting
        - When opening or creating a world
        - While playing
        - Other (explain below)
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: Attach the crash report file, or paste it on a site like https://mclo.gs and put the link here.
    validations:
      required: true
  - type: input
    id: forge
    attributes:
      label: Forge version
      placeholder: 14.23.5.2859
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: A modpack name or the list of other mods you use.
  - type: textarea
    id: what
    attributes:
      label: What were you doing?
